<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskNova – Smart Student Productivity</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #09090f;
    --surface: #12121c;
    --surface2: #1a1a2e;
    --border: rgba(255,255,255,0.07);
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --text: #f1f0ff;
    --muted: #6b7280;
    --danger: #ef4444;
    --success: #10b981;
    --critical: #ef4444;
    --high: #f97316;
    --medium: #eab308;
    --low: #10b981;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  [data-mood="lazy"] {
    --accent: #4c1d95; --accent2: #1e3a5f; --bg: #07070e; --surface: #0f0f1a;
  }
  [data-mood="exam"] {
    --accent: #dc2626; --accent2: #7f1d1d; --bg: #0a0a0a; --surface: #111;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

  /* ── Layout ── */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; min-height: 100vh; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 24px 0;
    position: fixed; top: 0; left: 0; z-index: 100;
    transition: transform .3s ease;
  }
  .main { margin-left: 240px; flex: 1; padding: 32px; min-height: 100vh; }

  /* ── Sidebar logo ── */
  .logo {
    font-family: var(--font-display); font-weight: 800; font-size: 1.4rem;
    padding: 0 24px 24px; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo span { font-weight: 400; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; cursor: pointer; transition: all .2s;
    font-size: 0.9rem; font-weight: 500; color: var(--muted);
    border-left: 3px solid transparent; position: relative;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active {
    color: var(--text); border-left-color: var(--accent);
    background: linear-gradient(90deg, rgba(124,58,237,0.12), transparent);
  }
  .nav-item .icon { font-size: 1.1rem; width: 20px; text-align: center; }
  .sidebar-bottom { margin-top: auto; padding: 24px; }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border-radius: var(--radius-sm);
    padding: 10px 14px; cursor: pointer;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; font-family: var(--font-display);
  }
  .user-name { font-size: 0.85rem; font-weight: 500; }
  .user-level { font-size: 0.72rem; color: var(--accent2); }

  /* ── Page header ── */
  .page-header { margin-bottom: 32px; }
  .page-title {
    font-family: var(--font-display); font-size: 2rem; font-weight: 800;
    letter-spacing: -1px; line-height: 1.1;
  }
  .page-sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

  /* ── Stats grid ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px;
    position: relative; overflow: hidden; cursor: default;
    transition: transform .2s, border-color .2s;
  }
  .stat-card:hover { transform: translateY(-3px); border-color: rgba(124,58,237,0.3); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--card-accent, var(--accent));
  }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-value {
    font-family: var(--font-display); font-size: 2.4rem; font-weight: 800;
    line-height: 1.1; margin: 6px 0 2px;
  }
  .stat-badge { font-size: 0.78rem; color: var(--muted); }
  .stat-icon { position: absolute; top: 18px; right: 18px; font-size: 1.5rem; opacity: 0.3; }

  /* ── Cards ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
  }
  .card-title {
    font-family: var(--font-display); font-size: 1rem; font-weight: 700;
    margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
  }

  /* ── Task cards ── */
  .tasks-list { display: flex; flex-direction: column; gap: 12px; }
  .task-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    transition: all .25s; cursor: pointer; position: relative;
    overflow: hidden;
  }
  .task-card:hover { transform: translateX(4px); border-color: rgba(124,58,237,0.25); background: var(--surface2); }
  .task-card.completed { opacity: 0.5; }
  .task-card.completed .task-title { text-decoration: line-through; }
  .task-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all .2s; font-size: 0.7rem;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.done { background: var(--accent); border-color: var(--accent); }
  .task-info { flex: 1; min-width: 0; }
  .task-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 20px;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .badge-critical { background: rgba(239,68,68,0.15); color: var(--critical); }
  .badge-high     { background: rgba(249,115,22,0.15); color: var(--high); }
  .badge-medium   { background: rgba(234,179,8,0.15);  color: var(--medium); }
  .badge-low      { background: rgba(16,185,129,0.15); color: var(--low); }
  .badge-pending  { background: rgba(107,114,128,0.15); color: var(--muted); }
  .badge-in-progress { background: rgba(6,182,212,0.15); color: var(--accent2); }
  .badge-completed { background: rgba(16,185,129,0.15); color: var(--success); }
  .task-deadline  { font-size: 0.75rem; color: var(--muted); }
  .task-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  .task-card:hover .task-actions { opacity: 1; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
    background: none; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    transition: all .2s;
  }
  .icon-btn:hover { background: rgba(239,68,68,0.1); color: var(--danger); border-color: var(--danger); }
  .icon-btn.focus-btn:hover { background: rgba(124,58,237,0.1); color: var(--accent); border-color: var(--accent); }

  /* ── Progress bar ── */
  .progress-bar-wrap { background: var(--surface2); border-radius: 20px; height: 6px; margin-top: 12px; }
  .progress-bar { height: 6px; border-radius: 20px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .8s ease; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: var(--radius-sm);
    font-family: var(--font-body); font-weight: 600; font-size: 0.875rem;
    cursor: pointer; transition: all .2s; border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6d28d9);
    color: white; box-shadow: 0 4px 20px rgba(124,58,237,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(124,58,237,0.5); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
  .btn-sm { padding: 7px 14px; font-size: 0.8rem; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    animation: fadeIn .2s ease;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px; width: 480px; max-width: 95vw;
    animation: slideUp .25s ease;
  }
  .modal-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  input, textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
    transition: border-color .2s; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* ── Focus Mode ── */
  .focus-mode {
    position: fixed; inset: 0; background: var(--bg); z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadeIn .3s ease;
  }
  .focus-task-name {
    font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;
    text-align: center; max-width: 500px; margin-bottom: 40px;
    background: linear-gradient(135deg, var(--text), var(--muted));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .timer-ring {
    position: relative; width: 220px; height: 220px; margin: 0 auto 32px;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-ring circle { fill: none; stroke-linecap: round; }
  .timer-bg { stroke: var(--surface2); }
  .timer-fill { stroke: var(--accent); transition: stroke-dashoffset .5s linear; }
  .timer-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .timer-countdown { font-family: var(--font-display); font-size: 3rem; font-weight: 800; }
  .timer-label { font-size: 0.8rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .timer-controls { display: flex; gap: 12px; }

  /* ── Charts area ── */
  .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 100px; margin-top: 16px; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart-bar {
    width: 100%; border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--accent), rgba(124,58,237,0.3));
    transition: height .6s ease; min-height: 4px;
  }
  .chart-bar-label { font-size: 0.65rem; color: var(--muted); }

  /* ── Timeline view ── */
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px;
    width: 2px; background: linear-gradient(180deg, var(--accent), var(--accent2), transparent);
  }
  .timeline-item { position: relative; padding: 0 0 20px 20px; }
  .timeline-item::before {
    content: ''; position: absolute; left: -8px; top: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
    box-shadow: 0 0 8px var(--accent);
  }
  .timeline-item.high::before { background: var(--high); box-shadow: 0 0 8px var(--high); }
  .timeline-item.critical::before { background: var(--critical); box-shadow: 0 0 8px var(--critical); }
  .timeline-date { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .timeline-title { font-size: 0.88rem; font-weight: 500; }

  /* ── Landing Page ── */
  .landing {
    min-height: 100vh; display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .landing-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 60px; border-bottom: 1px solid var(--border);
    position: relative; z-index: 10;
  }
  .landing-hero {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 80px 40px;
    position: relative;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.25);
    border-radius: 20px; padding: 6px 16px; font-size: 0.8rem;
    color: var(--accent); margin-bottom: 24px; letter-spacing: 1px; font-weight: 600;
  }
  .hero-title {
    font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 800; line-height: 1.05; letter-spacing: -2px;
    max-width: 800px; margin: 0 auto 20px;
  }
  .hero-title .grad {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero-sub { color: var(--muted); max-width: 500px; margin: 0 auto 36px; font-size: 1.05rem; line-height: 1.6; }
  .hero-btns { display: flex; gap: 12px; justify-content: center; }
  .features-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    padding: 0 60px 60px; max-width: 1100px; margin: 0 auto;
  }
  .feature-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
    transition: all .25s;
  }
  .feature-card:hover { transform: translateY(-4px); border-color: rgba(124,58,237,0.3); }
  .feature-icon { font-size: 1.8rem; margin-bottom: 12px; }
  .feature-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; }
  .feature-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
  /* ── BG glow ── */
  .bg-glow {
    position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
  }
  .glow-1 { width: 600px; height: 600px; background: rgba(124,58,237,0.1); top: -200px; left: -200px; }
  .glow-2 { width: 400px; height: 400px; background: rgba(6,182,212,0.07); bottom: 0; right: -100px; }

  /* ── Auth page ── */
  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; padding: 40px; width: 420px; max-width: 95vw;
    position: relative; z-index: 10;
  }
  .auth-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
  .auth-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; }
  .auth-switch { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
  .auth-switch span { color: var(--accent); cursor: pointer; font-weight: 600; }
  .auth-switch span:hover { text-decoration: underline; }

  /* ── Mood selector ── */
  .mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
  .mood-option {
    border: 2px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; text-align: center; cursor: pointer; transition: all .2s;
  }
  .mood-option:hover { border-color: var(--accent); }
  .mood-option.selected { border-color: var(--accent); background: rgba(124,58,237,0.1); }
  .mood-emoji { font-size: 1.6rem; }
  .mood-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* ── Gamification ── */
  .xp-bar-wrap { background: var(--surface2); border-radius: 20px; height: 8px; margin: 8px 0; overflow: hidden; }
  .xp-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1s ease; }
  .badges-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px; font-size: 0.75rem;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Toasts ── */
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 16px;
    font-size: 0.85rem; min-width: 260px; animation: slideInRight .3s ease;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.success { border-color: rgba(16,185,129,0.4); }
  .toast.error   { border-color: rgba(239,68,68,0.4); }

  /* ── Confetti particle ── */
  @keyframes confettiDrop {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  .confetti-particle {
    position: fixed; pointer-events: none; z-index: 999;
    width: 8px; height: 8px; border-radius: 2px;
    animation: confettiDrop 2s ease-in forwards;
  }
  /* ── Filters ── */
  .filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    font-size: 0.8rem; cursor: pointer; transition: all .2s; background: none; color: var(--muted);
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--text); }
  .filter-chip.active { background: rgba(124,58,237,0.15); border-color: var(--accent); color: var(--text); }

  /* ── Misc ── */
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .suggestions-list { display: flex; flex-direction: column; gap: 10px; }
  .suggestion-item {
    background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 0.85rem; border-left: 3px solid var(--accent);
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .tag { background: rgba(124,58,237,0.12); color: var(--accent); border-radius: 4px; padding: 2px 6px; font-size: 0.72rem; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-float { animation: float 3s ease-in-out infinite; }
  .animate-fade { animation: fadeIn .4s ease; }
  .animate-up { animation: slideUp .35s ease; }
  .count-animate { animation: countUp .5s ease; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blink { animation: pulse 1.5s ease-in-out infinite; }
  /* ── Voice Input ── */
  .voice-fab {
    position: fixed; bottom: 32px; right: 32px; z-index: 400;
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6d28d9);
    box-shadow: 0 4px 24px rgba(124,58,237,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; transition: all .25s;
  }
  .voice-fab:hover { transform: scale(1.1); box-shadow: 0 6px 32px rgba(124,58,237,0.7); }
  .voice-fab.listening {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    box-shadow: 0 4px 32px rgba(220,38,38,0.6);
    animation: voicePulse 1s ease-in-out infinite;
  }
  @keyframes voicePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 32px rgba(220,38,38,0.6); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ══════════════════════════════════════════════════════════
//  MOCK DATA (replace with real API calls in production)
// ══════════════════════════════════════════════════════════
const MOCK_USER = {

  { id: '3', title: 'Read Research Paper on ML Ethics',      description: '',                      deadline: new Date(Date.now()+7*86400000).toISOString(), priority: 'medium',   status: 'pending',     category: 'reading',    tags: ['AI','ML'] },
  { id: '4', title: 'Group Project Presentation Slides',     description: '10 slides needed',      deadline: new Date(Date.now()+2*86400000).toISOString(), priority: 'high',     status: 'pending',     category: 'project',    tags: ['Group'] },

const WEEKLY_DATA = [
  { day: 'Mon', tasks: 2 }, { day: 'Tue', tasks: 4 }, { day: 'Wed', tasks: 1 },
  { day: 'Thu', tasks: 5 }, { day: 'Fri', tasks: 3 }, { day: 'Sat', tasks: 0 }, { day: 'Sun', tasks: 2 },
];

// ══════════════════════════════════════════════════════════
//  UTILITY
// ══════════════════════════════════════════════════════════
const daysLeft = (d) => {
  if (!d) return null;
  return Math.ceil((new Date(d) - Date.now()) / 86400000);
};
const fmtDate = (d) => {
  if (!d) return '';
  const date = new Date(d);
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};
const priorityOrder = { critical: 4, high: 3, medium: 2, low: 1 };
const levelProgress = (pts) => {
  if (pts >= 1000) return 100;
  if (pts >= 500) return ((pts - 500) / 500) * 100;
  if (pts >= 200) return ((pts - 200) / 300) * 100;
  if (pts >= 50)  return ((pts - 50) / 150) * 100;
  return (pts / 50) * 100;
};

// ══════════════════════════════════════════════════════════
//  VOICE INPUT HOOK  (Web Speech API — zero dependencies)
// ══════════════════════════════════════════════════════════
const useVoiceInput = () => {
  const [listening, setListening]   = useState(false);
  const [transcript, setTranscript] = useState('');
  const [supported, setSupported]   = useState(false);
  const recogRef = useRef(null);

  useEffect(() => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      setSupported(true);
      const recog = new SpeechRecognition();
      recog.continuous      = false;
      recog.interimResults  = true;
      recog.lang            = 'en-US';

      recog.onresult = (e) => {
        const t = Array.from(e.results).map(r => r[0].transcript).join('');
        setTranscript(t);
      };
      recog.onend  = () => setListening(false);
      recog.onerror = () => setListening(false);
      recogRef.current = recog;
    }
  }, []);

  const startListening = () => {
    if (!recogRef.current) return;
    setTranscript('');
    setListening(true);
    recogRef.current.start();
  };
  const stopListening = () => {
    if (!recogRef.current) return;
    recogRef.current.stop();
    setListening(false);
  };

  return { listening, transcript, supported, startListening, stopListening, setTranscript };
};

// ── NLP parser: extract task fields from natural speech ──
const parseVoiceCommand = (text) => {
  const lower = text.toLowerCase();
  let title = text;
  let deadline = null;
  let category = 'other';
  let priority = null;

  // ── Strip wake words ──
  title = title.replace(/^(hey nova|nova|ok nova|add task|create task|new task|add|create|remind me to|i need to|task[:\s]*)/i, '').trim();

  // ── Day extraction ──
  const dayMap = { monday:1, tuesday:2, wednesday:3, thursday:4, friday:5, saturday:6, sunday:0 };
  const dayMatch = lower.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
  if (dayMatch) {
    const targetDay = dayMap[dayMatch[1]];
    const now = new Date();
    const diff = (targetDay - now.getDay() + 7) % 7 || 7;
    const d = new Date(now); d.setDate(now.getDate() + diff); d.setHours(23, 59, 0);
    deadline = d.toISOString().slice(0,16);
    title = title.replace(new RegExp(`(due\\s+)?(on\\s+|this\\s+|next\\s+)?${dayMatch[1]}`, 'i'), '').trim();
  }

  // ── Relative day: today / tomorrow / in N days ──
  if (!deadline) {
    if (/\btoday\b/.test(lower)) {
      const d = new Date(); d.setHours(23,59,0);
      deadline = d.toISOString().slice(0,16);
      title = title.replace(/\btoday\b/i,'').trim();
    } else if (/\btomorrow\b/.test(lower)) {
      const d = new Date(); d.setDate(d.getDate()+1); d.setHours(23,59,0);
      deadline = d.toISOString().slice(0,16);
      title = title.replace(/\btomorrow\b/i,'').trim();
    } else {
      const inDays = lower.match(/\bin\s+(\d+)\s+days?\b/);
      if (inDays) {
        const d = new Date(); d.setDate(d.getDate()+parseInt(inDays[1])); d.setHours(23,59,0);
        deadline = d.toISOString().slice(0,16);
        title = title.replace(/in\s+\d+\s+days?/i,'').trim();
      }
    }
  }

  // ── Category detection ──
  if (/\b(exam|test|quiz|midterm|final)\b/.test(lower))       category = 'exam';
  else if (/\b(assignment|homework|hw|submit|submission)\b/.test(lower)) category = 'assignment';
  else if (/\b(project|presentation|slides|report)\b/.test(lower))      category = 'project';
  else if (/\b(read|reading|chapter|book|paper)\b/.test(lower))         category = 'reading';

  // ── Explicit priority keywords ──
  if (/\b(urgent|critical|asap|immediately)\b/.test(lower))  priority = 'critical';
  else if (/\b(important|high priority)\b/.test(lower))       priority = 'high';

  // ── Clean up trailing noise ──
  title = title.replace(/\s*(due|by|on|at|the)\s*$/i,'').replace(/\s+/g,' ').trim();
  if (!title) title = text;

  // ── Capitalise first letter ──
  title = title.charAt(0).toUpperCase() + title.slice(1);

  return { title, deadline, category, priority };
};

// ══════════════════════════════════════════════════════════
//  VOICE NOVA COMPONENT
// ══════════════════════════════════════════════════════════
function VoiceNova({ onTaskParsed, addToast }) {
  const { listening, transcript, supported, startListening, stopListening, setTranscript } = useVoiceInput();
  const [open, setOpen]       = useState(false);
  const [parsed, setParsed]   = useState(null);
  const [confirmed, setConfirmed] = useState(false);

  // Re-parse whenever transcript changes
  useEffect(() => {
    if (transcript.trim().length > 2) {
      setParsed(parseVoiceCommand(transcript));
      setConfirmed(false);
    } else {
      setParsed(null);
    }
  }, [transcript]);

  const handleMicClick = () => {
    if (!supported) { addToast('Voice input not supported in this browser', 'error'); return; }
    if (listening) { stopListening(); }
    else { setOpen(true); setConfirmed(false); setParsed(null); setTranscript(''); startListening(); }
  };

  const handleConfirm = () => {
    if (!parsed) return;
    onTaskParsed(parsed);
    setOpen(false); setTranscript(''); setParsed(null); setConfirmed(false);
    addToast('🎤 Task added via voice!');
  };

  const handleRetry = () => {
    setTranscript(''); setParsed(null); setConfirmed(false);
    startListening();
  };

  const priorityColors = { critical:'var(--critical)', high:'var(--high)', medium:'var(--medium)', low:'var(--low)' };
  const fabBottom = 32;

  return (
    <>
      {/* Ripple rings when listening */}
      {listening && (
        <>
          <div className="voice-ripple" style={{width:60,height:60,bottom:fabBottom,right:32}} />
          <div className="voice-ripple" style={{width:60,height:60,bottom:fabBottom,right:32,animationDelay:'0.5s'}} />
        </>
      )}

      {/* Floating panel */}
      {open && (
        <div className="voice-modal">
          <div className="voice-modal-title">
            {listening
              ? <><span className="voice-status-dot" /> Listening…</>
              : <>🎤 Voice Input</>}
            <button onClick={() => { stopListening(); setOpen(false); }}
              style={{marginLeft:'auto',background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1rem'}}>✕</button>
          </div>

          {/* Transcript box */}
          <div className={`voice-transcript ${!transcript ? 'empty' : ''}`}>
            {transcript || 'Say something like "Add Physics exam due Friday"…'}
          </div>

          {/* Parsed preview */}
          {parsed && (
            <div className="voice-parsed">
              <div className="voice-parsed-row">
                <span className="voice-parsed-label">📝 Title</span>
                <span className="voice-parsed-val">{parsed.title}</span>
              </div>
              {parsed.deadline && (
                <div className="voice-parsed-row">
                  <span className="voice-parsed-label">📅 Deadline</span>
                  <span className="voice-parsed-val">{fmtDate(parsed.deadline)}</span>
                </div>
              )}
              <div className="voice-parsed-row">
                <span className="voice-parsed-label">🗂 Category</span>
                <span className="voice-parsed-val" style={{textTransform:'capitalize'}}>{parsed.category}</span>
              </div>
              {parsed.priority && (
                <div className="voice-parsed-row">
                  <span className="voice-parsed-label">🔺 Priority</span>
                  <span className="voice-parsed-val" style={{color: priorityColors[parsed.priority], textTransform:'capitalize'}}>{parsed.priority}</span>
                </div>
              )}
            </div>
          )}

          {/* Hints */}
          {!transcript && (
            <div className="voice-hint">
              Try: <strong>"Add Physics exam due Friday"</strong><br/>
              Or: <strong>"Create project report due in 3 days"</strong><br/>
              Or: <strong>"Hey Nova, homework due tomorrow"</strong>
            </div>
          )}

          <div className="voice-actions">
            {parsed
              ? <>
                  <button className="btn btn-primary btn-sm" onClick={handleConfirm} style={{flex:1}}>✅ Add Task</button>
                  <button className="btn btn-ghost btn-sm" onClick={handleRetry}>🔄 Retry</button>
                </>
              : listening
                ? <button className="btn btn-danger btn-sm" style={{flex:1}} onClick={stopListening}>⏹ Stop</button>
                : <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={startListening}>🎤 Start Again</button>
            }
          </div>
        </div>
      )}

      {/* FAB */}
      <button
        className={`voice-fab ${listening ? 'listening' : ''}`}
        onClick={handleMicClick}
        title={supported ? 'Voice Input — Hey Nova!' : 'Voice not supported'}
        style={{bottom: fabBottom}}
      >
        {listening
          ? <div className="mic-waves">{[1,2,3,4,5].map(i=><div key={i} className="mic-wave" style={{animationDelay:`${(i-1)*0.1}s`}}/>)}</div>
          : '🎤'}
      </button>
    </>
  );
}

// ══════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════
function Toast({ toasts }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span>{t.type === 'success' ? '✅' : '❌'}</span>

}

// ══════════════════════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════════════════════
function spawnConfetti() {
  const colors = ['#7c3aed','#06b6d4','#f59e0b','#10b981','#f43f5e'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-particle';
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 0.5}s;
      animation-duration: ${1.5 + Math.random()}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

// ══════════════════════════════════════════════════════════
//  FOCUS MODE
// ══════════════════════════════════════════════════════════
function FocusMode({ task, onClose }) {
  const [mins, setMins] = useState(25);
  const [secs, setSecs] = useState(0);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const total = 25 * 60;
  const remaining = mins * 60 + secs;
  const progress = ((total - remaining) / total);
  const circumference = 2 * Math.PI * 95;

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setSecs(s => {
        if (s === 0) {
          setMins(m => {
            if (m === 0) { setRunning(false); setDone(true); return 0; }
            return m - 1;
          });
          return 59;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running]);

  return (
    <div className="focus-mode">
      <div className="bg-glow glow-1" />
      <div className="bg-glow glow-2" />
      <p style={{color:'var(--muted)',fontSize:'0.8rem',letterSpacing:'3px',textTransform:'uppercase',marginBottom:'16px'}}>FOCUS MODE</p>
      <div className="focus-task-name animate-float">{task ? task.title : 'Deep Work Session'}</div>
      <div className="timer-ring">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle className="timer-bg" cx="110" cy="110" r="95" strokeWidth="6" />
          <circle className="timer-fill" cx="110" cy="110" r="95" strokeWidth="6"
            strokeDasharray={circumference}
            strokeDashoffset={circumference * (1 - progress)}
          />
        </svg>
        <div className="timer-text">
          <div className="timer-countdown">{String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}</div>
          <div className="timer-label">{done ? '✅ Done!' : running ? 'FOCUSING' : 'READY'}</div>
        </div>
      </div>
      <div className="timer-controls">
        {!done && (
          <button className="btn btn-primary" onClick={() => setRunning(r => !r)}>
            {running ? '⏸ Pause' : '▶ Start'}
          </button>
        )}
        <button className="btn btn-ghost" onClick={() => { setMins(25); setSecs(0); setRunning(false); setDone(false); }}>↺ Reset</button>
        <button className="btn btn-ghost" onClick={onClose}>✕ Exit</button>
      </div>
      {done && <p style={{marginTop:'20px',color:'var(--success)',fontWeight:600}}>🎉 Session complete! Great work!</p>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
//  ADD TASK MODAL
// ══════════════════════════════════════════════════════════
function AddTaskModal({ onClose, onAdd }) {
  const [form, setForm] = useState({ title:'', description:'', deadline:'', category:'other', estimatedMinutes: 25, tags:'' });
  const [detectedPriority, setDetectedPriority] = useState('medium');

  const computePriority = (deadline, desc) => {
    if (!deadline) return 'medium';
    const days = Math.ceil((new Date(deadline) - Date.now()) / 86400000);
    if (days <= 1) return 'critical';
    if (days <= 3) return 'high';
    if (days <= 7 && desc.length > 50) return 'high';
    if (days <= 7) return 'medium';
    return 'low';
  };

  const handleChange = (k, v) => {
    const next = { ...form, [k]: v };
    setForm(next);
    setDetectedPriority(computePriority(next.deadline, next.description));
  };

  const submit = () => {
    if (!form.title.trim()) return;
    const newTask = {
      id: Date.now().toString(),
      ...form,
      priority: detectedPriority,
      status: 'pending',
      tags: form.tags ? form.tags.split(',').map(t => t.trim()).filter(Boolean) : [],
    };
    onAdd(newTask);
    onClose();
  };

  const priorityColors = { critical:'var(--critical)', high:'var(--high)', medium:'var(--medium)', low:'var(--low)' };

  return (
    <div className="overlay" onClick={e => e.target.className === 'overlay' && onClose()}>
      <div className="modal animate-up">
        <div className="modal-title">✨ New Task</div>
        <div className="form-group">
          <label>Task Title *</label>
          <input placeholder="e.g. Complete Math Assignment" value={form.title} onChange={e => handleChange('title', e.target.value)} />
        </div>
        <div className="form-group">
          <label>Description</label>
          <textarea rows={3} placeholder="Details..." value={form.description} onChange={e => handleChange('description', e.target.value)} style={{resize:'vertical'}} />
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>Deadline</label>
            <input type="datetime-local" value={form.deadline} onChange={e => handleChange('deadline', e.target.value)} />
          </div>
          <div className="form-group">
            <label>Category</label>
            <select value={form.category} onChange={e => handleChange('category', e.target.value)}>
              <option value="assignment">📝 Assignment</option>
              <option value="exam">📚 Exam</option>
              <option value="project">🛠 Project</option>
              <option value="reading">📖 Reading</option>
              <option value="other">📌 Other</option>
            </select>
          </div>
        </div>
        <div className="form-group">
          <label>Tags (comma separated)</label>
          <input placeholder="CS, urgent, group" value={form.tags} onChange={e => handleChange('tags', e.target.value)} />
        </div>
        {form.deadline && (
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'var(--surface2)',borderRadius:'var(--radius-sm)',marginBottom:16}}>
            <span style={{fontSize:'0.78rem',color:'var(--muted)'}}>🤖 Smart Priority Detected:</span>
            <span style={{fontSize:'0.78rem',fontWeight:700,color:priorityColors[detectedPriority],textTransform:'uppercase',letterSpacing:1}}>{detectedPriority}</span>
          </div>
        )}
        <div className="modal-actions">
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary btn-sm" onClick={submit}>Add Task ✨</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
//  SIDEBAR

function Sidebar({ page, setPage, user }) {
  const nav = [
    { id:'dashboard', icon:'📊', label:'Dashboard' },
    { id:'tasks',     icon:'✅', label:'Tasks' },

// ══════════════════════════════════════════════════════════
//  DASHBOARD PAGE
// ══════════════════════════════════════════════════════════
function Dashboard({ tasks, user, onAddTask, onFocusTask }) {
  const total     = tasks.length;
  const completed = tasks.filter(t => t.status === 'completed').length;
  const pending   = tasks.filter(t => t.status === 'pending').length;
  const critical  = tasks.filter(t => t.priority === 'critical' && t.status !== 'completed').length;
  const rate      = total > 0 ? Math.round((completed / total) * 100) : 0;
  const maxBar    = Math.max(...WEEKLY_DATA.map(d => d.tasks), 1);

  const suggestions = tasks
    .filter(t => t.status !== 'completed' && t.deadline)
    .sort((a, b) => new Date(a.deadline) - new Date(b.deadline))
    .slice(0, 3)
    .map(t => {
      const d = daysLeft(t.deadline);
      if (d <= 0) return { task: t, msg: `🚨 "${t.title}" is overdue!` };
      if (d === 1) return { task: t, msg: `⚠️ "${t.title}" is due tomorrow!` };
      return { task: t, msg: `📌 "${t.title}" is due in ${d} days.` };
    });

  const upcoming = [...tasks]
    .filter(t => t.status !== 'completed')
    .sort((a, b) => new Date(a.deadline) - new Date(b.deadline))
    .slice(0, 4);

  return (
    <div className="animate-fade">
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <div className="page-title">Good day, {user.name.split(' ')[0]} 👋</div>
          <div className="page-sub">Here's your productivity snapshot</div>
        </div>
        <button className="btn btn-primary" onClick={onAddTask}>+ New Task</button>
      </div>

      <div className="stats-grid">
        {[
          { label:'Total Tasks',   value: total,     icon:'📋', accent:'var(--accent)',  badge: `${rate}% completion` },
          { label:'Completed',     value: completed, icon:'✅', accent:'var(--success)', badge: 'tasks done' },
          { label:'Pending',       value: pending,   icon:'⏳', accent:'var(--medium)',  badge: 'to do' },
          { label:'🔴 Critical',   value: critical,  icon:'🚨', accent:'var(--critical)',badge: 'need attention' },
        ].map((s, i) => (
          <div key={i} className="stat-card count-animate" style={{'--card-accent': s.accent}}>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value" style={{color: s.accent}}>{s.value}</div>
            <div className="stat-badge">{s.badge}</div>
            <div className="stat-icon">{s.icon}</div>
          </div>
        ))}
      </div>

      {/* Streak + XP */}
      <div className="section-grid">
        <div className="card">
          <div className="card-title">🔥 Study Streak & XP</div>
          <div style={{display:'flex',gap:24,marginBottom:12}}>
            <div>
              <div style={{fontSize:'2.5rem',fontFamily:'var(--font-display)',fontWeight:800,color:'var(--accent3)'}}>{user.streak}</div>
              <div style={{fontSize:'0.78rem',color:'var(--muted)'}}>day streak</div>
            </div>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:'0.78rem',color:'var(--muted)'}}>Level: <strong style={{color:'var(--text)'}}>{user.level}</strong></span>
                <span style={{fontSize:'0.78rem',color:'var(--muted)'}}>{user.points} XP</span>
              </div>
              <div className="xp-bar-wrap"><div className="xp-bar" style={{width: levelProgress(user.points)+'%'}} /></div>
              <div className="badges-row" style={{marginTop:10}}>
                {user.badges.map(b => (
                  <div key={b} className="badge-item">🏆 {b}</div>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* Suggestions */}
        <div className="card">
          <div className="card-title">🤖 Study Suggestions</div>
          <div className="suggestions-list">
            {suggestions.length === 0 ? (
              <div className="empty-state" style={{padding:'20px'}}>
                <div>🎉 All caught up!</div>
              </div>
            ) : suggestions.map((s, i) => (
              <div key={i} className="suggestion-item">{s.msg}</div>
            ))}
          </div>
        </div>
      </div>

      {/* Weekly Chart + Upcoming */}
      <div className="section-grid">
        <div className="card">
          <div className="card-title">📊 Weekly Progress</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
            <span style={{fontSize:'0.78rem',color:'var(--muted)'}}>Tasks completed per day</span>
            <span style={{fontSize:'0.78rem',color:'var(--accent)',fontWeight:600}}>{WEEKLY_DATA.reduce((a,b)=>a+b.tasks,0)} this week</span>
          </div>
          <div className="chart-bars">
            {WEEKLY_DATA.map((d, i) => (
              <div key={i} className="chart-bar-wrap">
                <div className="chart-bar" style={{height: `${(d.tasks / maxBar) * 100}%`}} />
                <div className="chart-bar-label">{d.day}</div>
              </div>
            ))}
          </div>
          <hr className="divider" />
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontSize:'0.78rem',color:'var(--muted)'}}>Completion Rate</span>
            <span style={{fontSize:'0.78rem',fontWeight:600,color:'var(--accent)'}}>{rate}%</span>
          </div>
          <div className="progress-bar-wrap"><div className="progress-bar" style={{width: rate+'%'}} /></div>
        </div>

        <div className="card">
          <div className="card-title">📅 Upcoming Deadlines</div>
          <div className="tasks-list">
            {upcoming.length === 0 ? (
              <div className="empty-state" style={{padding:'20px'}}><div>🎉 No upcoming tasks!</div></div>
            ) : upcoming.map(t => {
              const d = daysLeft(t.deadline);
              return (
                <div key={t.id} className="task-card" style={{padding:'12px 14px'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="task-title">{t.title}</div>
                    <div className="task-meta">
                      <span className={`badge badge-${t.priority}`}>{t.priority}</span>
                      <span className="task-deadline">{d <= 0 ? '🚨 Overdue' : d === 1 ? '⚠️ Tomorrow' : `${d}d left`}</span>
                    </div>
                  </div>
                  <button className="icon-btn focus-btn" onClick={() => onFocusTask(t)} title="Focus">🎯</button>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
//  TASKS PAGE
// ══════════════════════════════════════════════════════════
function TasksPage({ tasks, onAdd, onComplete, onDelete, onFocus }) {
  const [filter, setFilter] = useState('all');
  const [priorityFilter, setPriorityFilter] = useState('all');
  const [search, setSearch] = useState('');

  const filtered = tasks
    .filter(t => filter === 'all' || t.status === filter)
    .filter(t => priorityFilter === 'all' || t.priority === priorityFilter)
    .filter(t => !search || t.title.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => (priorityOrder[b.priority] || 0) - (priorityOrder[a.priority] || 0));

  return (
    <div className="animate-fade">
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <div className="page-title">My Tasks</div>
          <div className="page-sub">{filtered.length} tasks shown</div>
        </div>
        <button className="btn btn-primary" onClick={onAdd}>+ New Task</button>
      </div>

      <input placeholder="🔍 Search tasks..." value={search} onChange={e => setSearch(e.target.value)}
        style={{marginBottom:14, maxWidth:320}} />

      <div className="filter-row">
        {['all','pending','in-progress','completed'].map(f => (
          <button key={f} className={`filter-chip ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>
            {f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1)}
          </button>
        ))}
        <div style={{width:1,background:'var(--border)',margin:'0 4px'}} />
        {['all','critical','high','medium','low'].map(p => (
          <button key={p} className={`filter-chip ${priorityFilter === p ? 'active' : ''}`} onClick={() => setPriorityFilter(p)}>
            {p === 'all' ? 'All Priority' : p.charAt(0).toUpperCase() + p.slice(1)}
          </button>
        ))}
      </div>

      <div className="tasks-list">
        {filtered.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">📭</div>
            <div>No tasks found</div>
            <div style={{fontSize:'0.8rem',marginTop:6}}>Create one with the button above!</div>
          </div>
        ) : filtered.map(t => {
          const d = daysLeft(t.deadline);
          return (
            <div key={t.id} className={`task-card ${t.status === 'completed' ? 'completed' : ''} animate-up`}>
              <div className={`task-check ${t.status === 'completed' ? 'done' : ''}`}
                onClick={() => onComplete(t.id)}>
                {t.status === 'completed' && '✓'}
              </div>
              <div className="task-info">
                <div className="task-title">{t.title}</div>
                <div className="task-meta">
                  <span className={`badge badge-${t.priority}`}>{t.priority}</span>
                  <span className={`badge badge-${t.status}`}>{t.status}</span>
                  {t.category && <span className="tag">{t.category}</span>}
                  {t.tags && t.tags.slice(0,2).map(tg => <span key={tg} className="tag">{tg}</span>)}
                  {t.deadline && (
                    <span className="task-deadline" style={{color: d <= 1 ? 'var(--critical)' : 'var(--muted)'}}>
                      {d <= 0 ? '🚨 Overdue' : d === 1 ? '⚠️ Tomorrow' : `📅 ${fmtDate(t.deadline)}`}
                    </span>
                  )}
                </div>
              </div>
              <div className="task-actions">
                <button className="icon-btn focus-btn" onClick={() => onFocus(t)} title="Start Focus">🎯</button>
                <button className="icon-btn" onClick={() => onDelete(t.id)} title="Delete">🗑</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TimelinePage({ tasks }) {
  const sorted = [...tasks]
    .filter(t => t.status !== 'completed' && t.deadline)
    .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

  return (
    <div className="animate-fade">
      <div className="page-header">
        <div className="page-title">Task Timeline</div>
        <div className="page-sub">Your tasks visualized by deadline</div>
      </div>
      <div className="card">
        {sorted.length === 0 ? (
          <div className="empty-state"><div className="empty-icon">🎉</div><div>All tasks are completed!</div></div>
        ) : (
          <div className="timeline">
            {sorted.map((t, i) => {
              const d = daysLeft(t.deadline);
              return (
                <div key={t.id} className={`timeline-item ${t.priority}`}>
                  <div className="timeline-date">
                    {d <= 0 ? '🚨 Overdue' : d === 1 ? '⚠️ Tomorrow' : `📅 ${fmtDate(t.deadline)} (${d}d)`}
                  </div>
                  <div className="timeline-title">{t.title}</div>
                  <div style={{display:'flex',gap:6,marginTop:4}}>
                    <span className={`badge badge-${t.priority}`}>{t.priority}</span>
                    <span className="tag">{t.category}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

//  AUTH PAGE
// ══════════════════════════════════════════════════════════
function AuthPage({ onLogin }) {
  const [isLogin, setIsLogin] = useState(true);
  const [form, setForm] = useState({ name:'', email:'', password:'' });
  const [loading, setLoading] = useState(false);

  const submit = () => {
    if (!form.email || !form.password) return;
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      onLogin({ ...MOCK_USER, name: form.name || MOCK_USER.name });
    }, 800);
  };

  return (
    <div className="auth-page animate-fade">
      <div className="bg-glow glow-1" />
      <div className="bg-glow glow-2" />
      <div className="auth-card animate-up">
        <div className="logo" style={{paddingBottom:16}}>Task<span>Nova</span></div>
        <div className="auth-title">{isLogin ? 'Welcome back 👋' : 'Create account'}</div>
        <div className="auth-sub">{isLogin ? 'Log in to continue your productivity journey' : 'Start managing tasks like a pro'}</div>

        {!isLogin && (
          <div className="form-group">
            <label>Full Name</label>
            <input placeholder="Alex Nova" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
          </div>
        )}
        <div className="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@email.com" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
        </div>
        <div className="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" value={form.password} onChange={e => setForm({...form, password: e.target.value})}
            onKeyDown={e => e.key === 'Enter' && submit()} />
        </div>

        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={submit} disabled={loading}>
          {loading ? <span className="spin">⟳</span> : (isLogin ? 'Login →' : 'Create Account →')}
        </button>

        <div className="auth-switch">
          {isLogin ? <>No account? <span onClick={() => setIsLogin(false)}>Sign up</span></> : <>Have an account? <span onClick={() => setIsLogin(true)}>Log in</span></>}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen]       = useState('landing'); // landing | auth | app
  const [page, setPage]           = useState('dashboard');
  const [user, setUser]           = useState(null);
  const [tasks, setTasks]         = useState(MOCK_TASKS_INIT);
  const [showAdd, setShowAdd]     = useState(false);
  const [focusTask, setFocusTask] = useState(null);
  const [toasts, setToasts]       = useState([]);

  const addToast = (msg, type='success') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };

  const handleLogin = (u) => { setUser(u); setScreen('app'); };

  const handleComplete = (id) => {
    setTasks(ts => ts.map(t => {
      if (t.id !== id || t.status === 'completed') return t;
      spawnConfetti();
      addToast('🎉 Task completed! +20 XP earned');
      return { ...t, status: 'completed', completedAt: new Date().toISOString() };
    }));
    setUser(u => ({ ...u, points: u.points + 20 }));
  };

  const handleDelete = (id) => {
    setTasks(ts => ts.filter(t => t.id !== id));
    addToast('Task deleted', 'error');
  };

  const handleAdd = (task) => {
    setTasks(ts => [task, ...ts]);
    addToast(`✨ Task added with ${task.priority} priority!`);
  };

  // ── Voice: receives parsed fields, computes smart priority, creates task ──
  const handleVoiceTask = (parsed) => {
    const computePriority = (deadline, priority) => {
      if (priority) return priority;
      if (!deadline) return 'medium';
      const days = Math.ceil((new Date(deadline) - Date.now()) / 86400000);
      if (days <= 1) return 'critical';
      if (days <= 3) return 'high';
      if (days <= 7) return 'medium';
      return 'low';
    };
    const smartPriority = computePriority(parsed.deadline, parsed.priority);
    const newTask = {
      id: Date.now().toString(),
      title: parsed.title,
      description: '',
      deadline: parsed.deadline || '',
      category: parsed.category || 'other',
      priority: smartPriority,
      status: 'pending',
      tags: [],
      estimatedMinutes: 25,
    };
    setTasks(ts => [newTask, ...ts]);
    addToast(`🎤 "${parsed.title}" added — ${smartPriority} priority`);
  };

  if (screen === 'landing') return (
    <>
      <LandingPage onEnter={() => setScreen('auth')} />
      <Toast toasts={toasts} />
    </>
  );

  if (screen === 'auth') return (
    <>
      <AuthPage onLogin={handleLogin} />
      <Toast toasts={toasts} />
    </>
  );

  // Focus mode overlay
  if (page === 'focus' && focusTask === null) {
    const pending = tasks.filter(t => t.status !== 'completed');
    return (
      <div className="app-shell">
        <Sidebar page={page} setPage={setPage} user={user} />
        <main className="main animate-fade">
          <div className="page-header">
            <div className="page-title">Focus Mode 🎯</div>
            <div className="page-sub">Choose a task and enter deep work</div>
          </div>
          <div className="tasks-list">
            {pending.map(t => (
              <div key={t.id} className="task-card">
                <div className="task-info">
                  <div className="task-title">{t.title}</div>
                  <div className="task-meta">
                    <span className={`badge badge-${t.priority}`}>{t.priority}</span>
                    {t.deadline && <span className="task-deadline">📅 {fmtDate(t.deadline)}</span>}
                  </div>
                </div>
                <button className="btn btn-primary btn-sm" onClick={() => setFocusTask(t)}>🎯 Focus</button>
              </div>
            ))}
          </div>
        </main>
        <VoiceNova onTaskParsed={handleVoiceTask} addToast={addToast} />
        <Toast toasts={toasts} />
      </div>
    );
  }

  return (
    <>
      <div className="app-shell" data-mood={user?.mood || 'focus'}>
        <Sidebar page={page} setPage={p => { setPage(p); setFocusTask(null); }} user={user} />
        <main className="main">
          {page === 'dashboard' && (
            <Dashboard tasks={tasks} user={user}
              onAddTask={() => setShowAdd(true)}
              onFocusTask={t => { setFocusTask(t); setPage('focus'); }} />
          )}
          {page === 'tasks' && (
            <TasksPage tasks={tasks}
              onAdd={() => setShowAdd(true)}
              onComplete={handleComplete}
              onDelete={handleDelete}
              onFocus={t => { setFocusTask(t); setPage('focus'); }} />
          )}
          {page === 'timeline'  && <TimelinePage tasks={tasks} />}
          {page === 'analytics' && <AnalyticsPage tasks={tasks} user={user} />}
          {page === 'focus' && focusTask && (
            <FocusMode task={focusTask} onClose={() => { setFocusTask(null); setPage('dashboard'); }} />
          )}
        </main>
      </div>

      {showAdd && <AddTaskModal onClose={() => setShowAdd(false)} onAdd={handleAdd} />}
      <VoiceNova onTaskParsed={handleVoiceTask} addToast={addToast} />
      <Toast toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
